name: Inventory plan PR40

on:
  pull_request:
    branches:
      - release/amvera-transport-profile
    paths:
      - server/inventory_plan.py
      - server/inventory_workflow.py
      - server/service.py
      - server/models.py
      - server/postgres/005_inventory_count.sql
      - server/postgres_backend.py
      - release_online/inventory-count.js
      - release_online/index.html
      - server/inventory_statement.py
      - server/app.py
      - release_online/app.js
      - tests/test_inventory_plan.py
      - tests/test_inventory_statement.py
      - tests/inventory_pg_smoke.py
      - tests/inventory_browser_stage.py
      - tools/Test-InventoryMigration.ps1
      - tools/inventory_migration_stage.py
      - tests/test_inventory_migration_stage.py
      - server/reports.py
      - server/pg_admin.py
      - .github/workflows/inventory-plan-pr40.yml

permissions:
  contents: read

jobs:
  inventory-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install "openpyxl>=3.1,<4" "reportlab>=4,<5" "pytest>=8,<10"
      - name: Compile changed Python
        run: python -m compileall -q server/inventory_plan.py server/inventory_statement.py server/inventory_workflow.py server/service.py server/models.py tests/test_inventory_plan.py tests/test_inventory_statement.py tools/inventory_migration_stage.py
      - name: Inventory reader and statement tests
        run: python -m pytest -q tests/test_inventory_plan.py tests/test_inventory_statement.py
      - name: Check Windows restore-stage PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "tools/Test-InventoryMigration.ps1", [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            foreach ($error in $errors) { Write-Error $error }
            exit 1
          }
      - name: Validate user interface script syntax
        run: |
          node --check release_online/app.js
          node --check release_online/inventory-count.js

  postgres17-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: ksu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ksu_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned application dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "httpx>=0.27,<1" "pytest>=8,<10"
      - name: Check real migration verifier imports and non-local refusal
        run: python -m pytest -q tests/test_inventory_migration_stage.py
      - name: PostgreSQL 17 multi-user inventory test
        run: PYTHONPATH=. python tests/inventory_pg_smoke.py

  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: ksu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ksu_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application and headless browser
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "httpx>=0.27,<1" "playwright>=1.50,<2"
          python -m playwright install --with-deps chromium
      - name: Real browser plan/counting acceptance
        run: PYTHONPATH=.:tests python tests/inventory_browser_stage.py
      - name: Browser screenshots of synthetic data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr40-browser-evidence-synthetic
          path: browser-acceptance-evidence/
          if-no-files-found: ignore

  release-source-bundle:
    needs: [inventory-plan, postgres17-acceptance, browser-acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Export source-only PostgreSQL release candidate (never deploy)
        env:
          PR40_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python -m deploy.release_candidate.bundle --ref "$PR40_HEAD" --output pr40-release --profile postgresql
          python -m deploy.release_candidate.bundle --verify pr40-release
      - name: Upload verified source bundle for owner review
        uses: actions/upload-artifact@v4
        with:
          name: pr40-managed-postgres-source-only
          path: pr40-release/
          if-no-files-found: error
          # GitHub artifact upload excludes .dockerignore by default. This source-only
          # allowlisted bundle REQUIRES that hidden file for safe, reproducible builds.
          include-hidden-files: true
      - name: Download the actual published release artifact
        uses: actions/download-artifact@v4
        with:
          name: pr40-managed-postgres-source-only
          path: pr40-downloaded
      - name: Verify published artifact after GitHub upload/download
        env:
          PR40_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test -f pr40-downloaded/.dockerignore
          python -m deploy.release_candidate.bundle --verify pr40-downloaded
          python -c "import json,os,pathlib; path=pathlib.Path('pr40-downloaded/release-manifest.json'); data=json.loads(path.read_text()); assert data['source_sha']==os.environ['PR40_HEAD']; assert data['profile']=='postgresql'; print('PUBLISHED ARCHIVE VERIFIED:',data['source_sha'],len(data['files']),'hashed source files')"

name: Inventory PR40-PR41 audit

on:
  pull_request:
    branches:
      - release/amvera-transport-profile
      - feat/inventory-plan-counting-pg
    paths:
      - server/inventory_plan.py
      - server/inventory_workflow.py
      - server/service.py
      - server/models.py
      - server/postgres/005_inventory_count.sql
      - server/postgres_backend.py
      - release_online/inventory-count.js
      - release_online/index.html
      - server/inventory_statement.py
      - server/app.py
      - release_online/app.js
      - release_online/styles.css
      - release_online/sync.js
      - release_online/viewer.js
      - tests/pr41_*.py
      - tests/test_pr41_preservation.py
      - requirements-pr41-tests.txt
      - tests/test_inventory_plan.py
      - tests/test_inventory_statement.py
      - tests/inventory_pg_smoke.py
      - tests/inventory_browser_stage.py
      - tools/Test-InventoryMigration.ps1
      - tools/inventory_migration_stage.py
      - tests/test_inventory_migration_stage.py
      - server/reports.py
      - server/pg_admin.py
      - .github/workflows/inventory-plan-pr40.yml

permissions:
  contents: read

jobs:
  inventory-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-pr41-tests.txt
      - name: Compile changed Python
        run: python -m compileall -q server/inventory_plan.py server/inventory_statement.py server/inventory_workflow.py server/service.py server/models.py tests/test_inventory_plan.py tests/test_inventory_statement.py tools/inventory_migration_stage.py
      - name: Inventory reader and statement tests
        run: python -m pytest -q tests/test_inventory_plan.py tests/test_inventory_statement.py tests/test_pr41_preservation.py
      - name: Existing API, viewer, offline and backup regressions
        run: python -m unittest -v tests.test_api tests.test_viewer.Viewer tests.test_offline_stage1.Offline tests.test_offline_release.Release tests.test_backup_job
      - name: Check Windows restore-stage PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "tools/Test-InventoryMigration.ps1", [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            foreach ($error in $errors) { Write-Error $error }
            exit 1
          }
      - name: Validate user interface script syntax
        run: |
          node --check release_online/app.js
          node --check release_online/inventory-count.js
          node --check release_online/sync.js
          node --check release_online/viewer.js

  postgres17-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: ksu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ksu_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned application dependencies
        run: |
          python -m pip install -r requirements-pr41-tests.txt
      - name: Check real migration verifier imports and non-local refusal
        run: python -m pytest -q tests/test_inventory_migration_stage.py
      - name: PostgreSQL 17 multi-user inventory test
        run: PYTHONPATH=.:tests python tests/pr41_pg_acceptance.py

      - name: PostgreSQL viewer regression contracts
        env:
          KSU_TEST_PG_ADMIN_DSN: host=127.0.0.1 port=5432 dbname=postgres user=postgres password=test-only-password sslmode=disable
          KSU_TEST_PG_RUNTIME_DSN: host=127.0.0.1 port=5432 dbname=postgres user=ksu_runtime password=test-only-runtime sslmode=disable
        run: python -m unittest -v tests.test_viewer.PostgreSQLViewer

  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: ksu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ksu_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application and headless browser
        run: |
          python -m pip install -r requirements-pr41-tests.txt
          python -m playwright install --with-deps chromium
      - name: Real browser plan/counting acceptance
        run: PYTHONPATH=.:tests python tests/pr41_browser_acceptance.py
      - name: Browser screenshots of synthetic data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr41-browser-reports-synthetic
          path: browser-acceptance-evidence/
          if-no-files-found: ignore

  release-source-bundle:
    needs: [inventory-plan, postgres17-acceptance, browser-acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Export source-only PostgreSQL release candidate (never deploy)
        env:
          INVENTORY_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python -m deploy.release_candidate.bundle --ref "$INVENTORY_HEAD" --output inventory-release --profile postgresql
          python -m deploy.release_candidate.bundle --verify inventory-release
      - name: Upload verified source bundle for owner review
        uses: actions/upload-artifact@v4
        with:
          name: inventory-managed-postgres-source-only-${{ github.event.pull_request.head.sha }}
          path: inventory-release/
          if-no-files-found: error
          # GitHub artifact upload excludes .dockerignore by default. This source-only
          # allowlisted bundle REQUIRES that hidden file for safe, reproducible builds.
          include-hidden-files: true
      - name: Download the actual published release artifact
        uses: actions/download-artifact@v4
        with:
          name: inventory-managed-postgres-source-only-${{ github.event.pull_request.head.sha }}
          path: inventory-downloaded
      - name: Verify published artifact after GitHub upload/download
        env:
          INVENTORY_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test -f inventory-downloaded/.dockerignore
          python -m deploy.release_candidate.bundle --verify inventory-downloaded
          python -c "import json,os,pathlib; path=pathlib.Path('inventory-downloaded/release-manifest.json'); data=json.loads(path.read_text()); assert data['source_sha']==os.environ['INVENTORY_HEAD']; assert data['profile']=='postgresql'; print('PUBLISHED ARCHIVE VERIFIED:',data['source_sha'],len(data['files']),'hashed source files')"

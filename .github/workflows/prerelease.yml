name: Prerelease analytics performance
on:
  pull_request:
    branches: [main, feat/issue-15-writeoff-analytics]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  paired-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Extract the exact PR 24 baseline, tracked synthetic source only
        run: |
          mkdir -p "$GITHUB_WORKSPACE/var/issue25-baseline"
          git archive 17521cd3386924e1483edd0cf68913998f720a50 | tar -x -C "$GITHUB_WORKSPACE/var/issue25-baseline"
      - run: docker build -f Dockerfile.postgres -t ksu-postgres:test .
      - name: Paired 120 HTTP samples, real cursor plans, exact metrics, history and independent restore
        run: python -m experiments.prerelease.run --image ksu-postgres:test --baseline-source "$GITHUB_WORKSPACE/var/issue25-baseline" --output "$GITHUB_WORKSPACE/var/prerelease-checks"
      - name: Report whitelisted latency and failure diagnostics in annotations
        if: always()
        run: python -m experiments.prerelease.summarize "$GITHUB_WORKSPACE/var/prerelease-checks"
      - name: Publish aggregate measurements and plans, never databases, credentials or workbooks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prerelease-performance
          path: |
            var/prerelease-checks/prerelease-*.json
            var/prerelease-checks/prerelease-*.txt
          retention-days: 14

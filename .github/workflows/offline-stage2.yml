name: Offline stage 2 full visit
on:
  pull_request:
    branches: [feat/offline-stage1-server]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, postgres]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Persistent browser, real API, lost commit responses, ACL, conflicts and storage refusal
        env:
          BACKEND: ${{ matrix.backend }}
        run: python -u -m tests.offline_stage2 --backend "$BACKEND"
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python deploy/get_caddy.py --output /tmp/ksu-caddy
      - env:
          CADDY_BIN: /tmp/ksu-caddy
        run: python -m unittest discover -s tests -v
      - name: Real PostgreSQL regressions and stage-2 header guards
        run: python -m tests.offline_stage1_environment --output var/offline-stage2-checks
      - run: |
          node --check experiments/offline_visit/app.js
          node --check experiments/offline_visit/transport.js
          node --check experiments/offline_visit/store.js
      - name: Isolated launcher mounts and verified HTTPS, no production database
        run: |
          docker build -f Dockerfile.postgres -t ksu-postgres:stage2-test .
          python -m tests.offline_stage2_container --image ksu-postgres:stage2-test
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - shell: powershell
        run: |
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'experiments/offline_visit/Start-VisitLab.ps1'),[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
